AWSTemplateFormatVersion: '2010-09-09'
Description: G-Scores backend-only ECS service; PostgreSQL and Redis are managed separately by g-scores-data.

Parameters:
  ClusterName:
    Type: String
  BackendImage:
    Type: String
    Description: Immutable ECR runtime image URI including tag or digest.
  TaskFamily:
    Type: String
    Default: g-scores-app-TaskDefinition-PrT3TvNO1ydM
    Description: Keep a stable task family across image updates.
  HostInstanceId:
    Type: String
    AllowedPattern: '^i-[0-9a-f]+$'
    Default: i-0ca15f1d1e04c71f4
    Description: The existing host running the independent PostgreSQL and Redis services.

Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: G-Scores PostgreSQL credentials.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"g_scores","dbname":"g_scores"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  RedisSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: G-Scores Redis cache password.
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: ReadServiceCredentials
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseSecret
                  - !Ref RedisSecret

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref TaskFamily
      RequiresCompatibilities:
        - EC2
      NetworkMode: host
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          Cpu: 1024
          Memory: 2048
          Environment:
            - Name: SERVER_PORT
              Value: '8080'
            - Name: SERVER_ADDRESS
              Value: 127.0.0.1
            - Name: SPRING_PROFILES_ACTIVE
              Value: production
            - Name: SPRING_DATA_REDIS_HOST
              Value: 127.0.0.1
            - Name: SPRING_DATA_REDIS_PORT
              Value: '6379'
            - Name: CACHE_TTL_SECONDS
              Value: '3600'
            - Name: SPRING_DATASOURCE_URL
              Value: jdbc:postgresql://127.0.0.1:5432/g_scores
            - Name: SPRING_DATASOURCE_USERNAME
              Value: g_scores
            - Name: JAVA_TOOL_OPTIONS
              Value: -Xms256m -Xmx1024m
          Secrets:
            - Name: SPRING_DATASOURCE_PASSWORD
              ValueFrom: !Sub '${DatabaseSecret}:password::'
            - Name: SPRING_DATA_REDIS_PASSWORD
              ValueFrom: !Ref RedisSecret
          PortMappings:
            - ContainerPort: 8080
              HostPort: 8080
              Protocol: tcp
          HealthCheck:
            Command:
              - CMD-SHELL
              - wget --quiet --spider http://127.0.0.1:8080/v3/api-docs || exit 1
            Interval: 30
            Timeout: 5
            Retries: 5
            StartPeriod: 300
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  Service:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ClusterName
      LaunchType: EC2
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub "ec2InstanceId == '${HostInstanceId}'"
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  LogGroupName:
    Value: !Ref LogGroup
  DatabaseSecretArn:
    Value: !Ref DatabaseSecret
  RedisSecretArn:
    Value: !Ref RedisSecret
