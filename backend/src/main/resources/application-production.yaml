spring:
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false

app:
  cache:
    ttl-seconds: ${CACHE_TTL_SECONDS:3600}
    key-prefix: "g-scores:production:v1:"
